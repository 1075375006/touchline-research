name: touchline
services:
  app:
    build: .
    image: touchline-research:1.3.0
    init: true
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-4318}:4318"
    environment:
      APP_SECRET: ${APP_SECRET:?Run sh scripts/deploy.sh first}
      SETUP_TOKEN: ${SETUP_TOKEN:?Run sh scripts/deploy.sh first}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_URL: ${PUBLIC_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    volumes:
      - touchline-data:/app/data
    extra_hosts:
      - host.docker.internal:host-gateway
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
    stop_grace_period: 20s
  searxng:
    image: ${SEARXNG_IMAGE:-searxng/searxng:latest}
    profiles: [searxng]
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${APP_SECRET}
    volumes:
      - ./config/searxng.yml:/etc/searxng/settings.yml:ro
      - searxng-data:/var/cache/searxng
    expose: ["8080"]
volumes:
  touchline-data:
  searxng-data:
